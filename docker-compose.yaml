version: "3.9"

services:
  todo-fast-api:
    build: .
    container_name: fastapi_todo_app
    ports:
      - '${APP_PORT}:${APP_PORT}'
    depends_on:
      - todo-fast-db
    volumes:
      - ${PWD}:/app
    environment:
      DATABASE_URL: "${DATABASE_URL}"
  todo-fast-db:
    image: postgres:15-alpine
    container_name: todo_fast_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - todo-postgres_data:/var/lib/postgresql/data

volumes:
  todo-postgres_data: